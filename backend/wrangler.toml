# 综测加分申报与审核系统 · 后端（Cloudflare Worker）
name = "zongce-api"
main = "src/index.js"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# 前端 Cloudflare Pages 的域名，用于 CORS 白名单；留 "*" 表示允许任意来源
ALLOWED_ORIGIN = "*"

# D1 数据库：部署前把 database_id 换成 `wrangler d1 create zongce-db` 返回的真实 ID
[[d1_databases]]
binding = "DB"
database_name = "zongce-db"
database_id = "a425ec30-a4de-4175-951d-958221986d3c"

# KV 命名空间：存放学生上传的证明材料（base64）
[[kv_namespaces]]
binding = "FILES"
id = "0c8623629f06415485c9b4db263e6e9c"
