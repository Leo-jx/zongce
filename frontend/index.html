<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>登录 · 综合素质测评管理系统</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="apple-touch-icon" href="/logo.png">
<style>
:root{
  --bg:#f2f5f9; --card:#fff; --line:#e3e8ef; --line-strong:#c9d3e0;
  --ink:#1f2d3d; --ink-2:#52657a; --ink-3:#8a9bad;
  --primary:#1b5fa8; --primary-2:#2f7fd1; --primary-bg:#eaf2fb;
  --good:#1a7f4b; --bad:#b3362f; --warn:#b3541e;
  --radius:12px; --shadow:0 1px 3px rgba(31,45,61,.08),0 10px 40px rgba(31,45,61,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px 16px;
}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}

.page{width:100%;max-width:420px}
.brand{text-align:center;margin-bottom:18px}
.brand .logo{width:72px;height:72px;display:block;margin:0 auto 10px;object-fit:contain;filter:drop-shadow(0 6px 14px rgba(27,95,168,.28))}
.brand h1{font-size:19px;font-weight:700;letter-spacing:.5px}
.brand p{font-size:12.5px;color:var(--ink-2);margin-top:4px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 22px 20px}
.fld{margin-bottom:14px}
.fld .lab{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--ink-2);margin-bottom:6px}
.input-wrap{position:relative;display:flex;align-items:center}
.input-wrap input{width:100%;border:1px solid var(--line-strong);border-radius:10px;padding:12px 14px;font-size:15px;color:var(--ink);background:#fff;-webkit-appearance:none}
.input-wrap input:focus{outline:0;border-color:var(--primary);box-shadow:0 0 0 3px rgba(31,95,168,.12)}
.input-wrap.invalid input{border-color:var(--bad)}
.input-wrap .eye{position:absolute;right:6px;border:0;background:none;color:var(--ink-3);font-size:12px;padding:8px 10px;border-radius:8px}
.err{font-size:12px;color:var(--bad);margin-top:6px;min-height:16px}

.btn{width:100%;border:0;border-radius:10px;padding:13px 16px;font-size:15px;font-weight:600;background:var(--primary);color:#fff;margin-top:6px;transition:filter .15s}
.btn:hover:not(:disabled){filter:brightness(1.06)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--primary);border:1px solid var(--line-strong);margin-top:10px}

/* 登录成功面板 */
.done{text-align:center;padding:6px 0 0}
.done .ok-icon{width:52px;height:52px;border-radius:50%;background:#e7f6ed;color:var(--good);font-size:26px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.done h2{font-size:17px;margin-bottom:4px}
.done .who{font-size:13px;color:var(--ink-2);margin-bottom:14px}
.done .who b{color:var(--primary)}
.mods{text-align:left;border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.mods .t{font-size:12px;color:var(--ink-3);margin-bottom:8px}
.mod{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:9px;margin-bottom:7px}
.mod .n{font-size:13px;font-weight:600}
.mod .d{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.countdown{font-size:12px;color:var(--ink-3);margin-top:10px}

.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:#1f2d3d;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:all .25s;z-index:200;max-width:86vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--bad)}
.hidden{display:none!important}

@media (max-width:420px){
  .card{padding:18px 16px 16px}
  .brand h1{font-size:17px}
  .btn{padding:12px 14px}
}
</style>
</head>
<body>

<div class="page">
  <div class="brand">
    <img class="logo" src="/logo.png" alt="校徽">
    <h1>综合素质测评管理系统</h1>
    <p>学号登录学生端 · 工号登录教职工端</p>
  </div>

  <!-- 登录表单 -->
  <div class="card" id="formCard">
    <div class="fld">
      <div class="lab"><span>账号</span></div>
      <div class="input-wrap" id="wrapAccount">
        <input type="text" id="account" placeholder="请输入学号或工号" autocomplete="username" inputmode="text" autocapitalize="off" spellcheck="false">
      </div>
    </div>

    <div class="fld">
      <div class="lab"><span>密码</span></div>
      <div class="input-wrap" id="wrapPassword">
        <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password">
        <button type="button" class="eye" id="btnEye" aria-label="显示密码">显示</button>
      </div>
      <div class="err" id="errMsg"></div>
    </div>

    <button class="btn" id="btnLogin">登 录</button>
    <button class="btn ghost" id="btnGuest">以访客身份浏览（免登录）</button>
  </div>

  <!-- 登录成功：按角色展示可用功能模块 -->
  <div class="card hidden" id="doneCard">
    <div class="done">
      <div class="ok-icon">✓</div>
      <h2 id="doneTitle">登录成功</h2>
      <div class="who">欢迎你，<b id="doneName"></b>（<span id="doneRole"></span>）</div>

      <div class="mods">
        <div class="t">身份已识别：<b id="doneTarget"></b>　页面：<b id="donePage"></b></div>
        <div class="t" style="margin-top:10px">你可以使用的功能模块</div>
        <div id="doneModules"></div>
      </div>

      <button class="btn" id="btnEnter">进入</button>
      <button class="btn ghost hidden" id="btnAlt">同时可进入教职工端</button>
      <div class="countdown" id="countdown"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="auth.js"></script>
<script>
const API = window.API_BASE || '';

const el = id => document.getElementById(id);

let toastTimer = null;
function toast(msg, type) {
  const t = el('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = 'toast'; }, 2600);
}

/* ---------- 表单校验 ---------- */
/**
 * 提交 / 失焦时的完整校验，返回错误信息（空串表示通过）。
 * 账号是学号还是工号由服务端判定：工号也可能是纯数字，前端不按字符构成猜测，避免误判。
 */
function validate() {
  const account = el('account').value.trim();
  const password = el('password').value;

  let msg = '';
  if (!account) msg = '请输入学号或工号';
  else if (!password) msg = '请输入密码';
  else if (password.length < 6) msg = '密码至少 6 位';

  el('errMsg').textContent = msg;
  el('wrapAccount').classList.toggle('invalid', !account);
  el('wrapPassword').classList.toggle('invalid', msg === '请输入密码' || msg === '密码至少 6 位');
  return msg;
}

/* ---------- 登录 ---------- */
let submitting = false;
async function doLogin() {
  if (submitting) return;
  const msg = validate();
  if (msg) { toast(msg, 'err'); return; }

  submitting = true;
  const btn = el('btnLogin');
  btn.disabled = true;
  btn.textContent = '登录中...';

  try {
    const resp = await fetch(API + '/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ account: el('account').value.trim(), password: el('password').value }),
    });
    const result = await resp.json().catch(() => null);
    if (!result || result.code !== 0) {
      toast(result ? result.msg : '登录失败，请稍后重试', 'err');
      return;
    }
    // 身份完全以服务端返回的 role 为准，前端不猜测账号类型
    ZCAuth.saveSession(result.data);
    showDone(result.data);
  } catch (e) {
    toast('网络异常：' + e.message, 'err');
  } finally {
    submitting = false;
    btn.disabled = false;
    btn.textContent = '登 录';
  }
}

/* ---------- 登录成功：按角色展示模块 ---------- */
let target = '';
function showDone(data) {
  const role = data.role;
  const perms = new Set(data.permissions || []);
  const modules = (ZCAuth.ROLE_MODULES[role] || []).filter(m => !m.need || perms.has(m.need));

  el('formCard').classList.add('hidden');
  el('doneCard').classList.remove('hidden');
  el('doneName').textContent = data.name;
  el('doneRole').textContent = ZCAuth.ROLE_LABEL[role] || role;
  el('doneTitle').textContent = role === 'student' ? '已进入学生端' : (role === 'admin' ? '已进入管理端' : '已进入教职工端');
  el('doneModules').innerHTML = modules.length
    ? modules.map(m => '<div class="mod"><div><div class="n">' + esc(m.name) + '</div><div class="d">' + esc(m.desc) + '</div></div></div>').join('')
    : '<div class="mod"><div><div class="n">暂无可用模块</div><div class="d">请联系管理员为你分配权限</div></div></div>';

  target = ZCAuth.home(role);
  el('doneTarget').textContent = ZCAuth.ROLE_LABEL[role] || role;
  el('donePage').textContent = target;
  el('btnEnter').textContent = '进入' + (ZCAuth.ROLE_LABEL[role] || role) + '页面（' + target + '）';

  // 超级管理员可同时进入教职工端
  const alt = el('btnAlt');
  if (role === 'admin') { alt.classList.remove('hidden'); alt.onclick = () => { location.href = 'teacher.html'; }; }
  else alt.classList.add('hidden');

  let left = 3;
  el('countdown').textContent = left + ' 秒后自动跳转...';
  const timer = setInterval(() => {
    left--;
    if (left <= 0) { clearInterval(timer); location.href = target; }
    else el('countdown').textContent = left + ' 秒后自动跳转...';
  }, 1000);
}

function esc(x) {
  return String(x == null ? '' : x).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* ---------- 事件 ---------- */
el('account').addEventListener('blur', validate);
el('password').addEventListener('input', () => { if (el('errMsg').textContent) validate(); });
el('password').addEventListener('blur', () => { if (el('password').value) validate(); });
el('account').addEventListener('keydown', e => { if (e.key === 'Enter') el('password').focus(); });
el('password').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
el('btnLogin').addEventListener('click', doLogin);
el('btnEnter').addEventListener('click', () => { location.href = target; });
el('btnGuest').addEventListener('click', () => { ZCAuth.enterGuest(); });
el('btnEye').addEventListener('click', () => {
  const p = el('password');
  const show = p.type === 'password';
  p.type = show ? 'text' : 'password';
  el('btnEye').textContent = show ? '隐藏' : '显示';
});

// 已登录则直接回对应角色的专属页面
(function () {
  const s = ZCAuth.readSession();
  if (s) location.href = ZCAuth.home(s.user.role);
  else el('account').focus();
})();
</script>
</body>
</html>
